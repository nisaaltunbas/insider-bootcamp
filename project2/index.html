<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="task-management">
        <h1>Task Management</h1>
        <button class="open-task">Add Task</button>
        <button id="showCompleted">Show Completed</button>
        <button id="sortPriority">Sort Priority</button>

    </div>
    
    <div id="errorPopup" style="display: none;" class="error-popup">
        <div class="error-content">
            <span class="close-error" onclick="closeErrorPopup()">&times;</span>
            <p id="errorMessage"></p>
        </div>
    </div>

        <div id="taskModal" class="modal">
            <div class="task-content">
                <span class="close-task">&times;</span>
                <h2>Add New Task</h2>
                <form id="taskForm">
                <label class="title-label" for="">Task Title</label>
                <input type="text" id="taskTitle" placeholder="Task Title" required>
                <label class="title-label" for="">Task Description</label>
                <textarea name="" id="taskDescription" placeholder="Task Description"></textarea>


                <label class="title-label" for="">Priority</label>
                <div class="priority">
                <label for=""><input type="radio" name="priority" value="Low" >Low</label>
                <label for=""><input type="radio" name="priority" value="Medium" >Medium</label>
                <label for=""><input type="radio" name="priority" value="High" >High</label>
            </div>
            <p id="error" class="error"></p>

              
            <button type="submit">Add Task</button>
                </form>
        </div>
    </div>
    <div id="taskList">
        <div class="task-item" data-priority="high">
            <h3>Task Title</h3>
            <p>Description of the task</p>
            <p>Priority:</p>
            <button class="complete-btn">Complete</button>
            <button class="delete-btn">Delete</button>
        
          </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
