<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Profiles</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fancybox/3.5.7/jquery.fancybox.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <button id="load-users" class="load-button">Get Users</button>

    <div id="user-cards-container" class="user-cards-container"></div>


    <div style="display: none;" id="user-detail-modal">
        <div class="modal-content">
            <h3 id="user-fullname"></h3>
            <p><strong>Email:</strong> <span id="user-email"></span></p>
            <p><strong>Country:</strong> <span id="user-country"></span></p>
            <img id="user-image" src="" alt="User Image" style="width: 100%; border-radius: 8px;"/>
        </div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
